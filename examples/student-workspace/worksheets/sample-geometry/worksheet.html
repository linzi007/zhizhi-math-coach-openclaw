<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>长方形周长图形小练</title>
  <style>
    @page {
      size: A4;
      margin: 12mm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.32;
      color: #111;
      background: #fff;
    }

    .sheet {
      max-width: 186mm;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 5px;
      text-align: center;
      font-size: 25px;
      line-height: 1.15;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 5px;
      font-size: 15px;
      line-height: 1.25;
    }

    .line {
      display: inline-block;
      min-width: 25mm;
      border-bottom: 1px solid #222;
      height: 17px;
      vertical-align: bottom;
    }

    .tip {
      border: 1px solid #222;
      padding: 4px 8px;
      margin-bottom: 5px;
      font-size: 15px;
      line-height: 1.25;
    }

    h2 {
      margin: 5px 0 3px;
      font-size: 17px;
      line-height: 1.2;
    }

    .read-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 4px;
    }

    .read-card {
      border: 1px solid #bbb;
      min-height: 20mm;
      padding: 4px 6px;
      font-size: 15px;
      line-height: 1.25;
    }

    .mental-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px 10px;
      margin-bottom: 4px;
    }

    .compact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px 10px;
      margin-bottom: 4px;
    }

    .item {
      white-space: nowrap;
      min-height: 20px;
      line-height: 1.25;
    }

    .blank {
      display: inline-block;
      width: 15mm;
      border-bottom: 1px solid #222;
      height: 18px;
      vertical-align: bottom;
    }

    .blank-wide {
      display: inline-block;
      width: 24mm;
      border-bottom: 1px solid #222;
      height: 18px;
      vertical-align: bottom;
    }

    .problem-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px 10px;
    }

    .geometry-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin-bottom: 4px;
    }

    .problem {
      border: 1px solid #bbb;
      min-height: 24mm;
      padding: 5px 6px;
      break-inside: avoid;
    }

    .problem.tall {
      min-height: 30mm;
    }

    .geometry-diagram {
      display: block;
      width: 100%;
      max-width: 78mm;
      height: auto;
      margin: 5px auto 3px;
    }

    .geometry-diagram text {
      font-size: 12px;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    .prompt {
      font-size: 16px;
      line-height: 1.25;
    }

    .work-line {
      display: block;
      margin-top: 4px;
      height: 15px;
      border-bottom: 1px solid #222;
    }

    .answer-line {
      margin-top: 4px;
      font-size: 16px;
      line-height: 1.25;
    }

    .choice {
      display: inline-block;
      min-width: 11mm;
      margin-right: 3mm;
      border: 1px solid #999;
      text-align: center;
      line-height: 1.35;
    }

    .chain {
      margin-top: 3px;
      font-size: 15px;
      line-height: 1.25;
    }

    .dash {
      display: block;
      margin-top: 2px;
      height: 17px;
      border-bottom: 1px dashed #888;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px 10px;
    }

    .check-card {
      border: 1px solid #bbb;
      min-height: 22mm;
      padding: 5px 6px;
      line-height: 1.3;
    }

    .footer {
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>长方形周长图形小练</h1>
    <section class="meta">
      <div>姓名：<span class="line"></span></div>
      <div>日期：<span class="line"></span></div>
      <div>用时：<span class="line"></span></div>
      <div>正确题数：<span class="line"></span></div>
    </section>
    <section class="tip">先找长和宽，再想一圈有几条边。</section>
    <h2>看图求周长</h2>
    <section class="geometry-grid">
      <div class="problem tall">
        <div class="prompt">1. 求下面长方形的周长。</div>
        <svg class="geometry-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" role="img" aria-label="长方形，长8厘米，宽5厘米">
          <rect x="40" y="30" width="130" height="70" fill="none" stroke="#111" stroke-width="2"/>
          <text x="105.0" y="118">8 cm</text>
          <text x="22" y="65.0">5 cm</text>
        </svg>
        <span class="work-line"></span>
        <span class="work-line"></span>
        <div class="answer-line">周长是<span class="blank"></span>cm</div>
      </div>
    </section>

  </main>
</body>
</html>
